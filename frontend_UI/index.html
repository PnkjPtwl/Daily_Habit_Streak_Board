<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Habit Streak Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>🔥 Habit Tracker</h1>
  </header>

  <main class="container">

    <!-- Add Habit -->
    <div class="add-habit">
      <input id="habitInput" placeholder="New habit..." />
      <button onclick="addHabit()">Add</button>
    </div>

    <!-- Habit List -->
    <div id="habitList"></div>

    <!-- Weekly Summary -->
    <div class="summary">
      <h2>📊 Weekly Summary</h2>
      <p id="total">Total Completed: 0</p>
      <p id="percentage">Completion: 0%</p>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
